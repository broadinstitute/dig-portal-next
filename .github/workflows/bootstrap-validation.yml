name: Bootstrap validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bootstrap:
    name: Workspace and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm portal validate
      - run: pnpm portal test
      - run: pnpm portal typecheck cmd
      - run: pnpm portal build cmd
      - run: pnpm portal test cmd
